<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@neo.bnb.mx | Instagram Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <!-- Contenedor Principal -->
  <main class="max-w-md w-full bg-gray-800 rounded-2xl shadow-xl p-6 mt-8 border border-gray-700 text-center">
    
    <!-- Foto de Perfil / Avatar -->
    <div class="relative w-28 h-28 mx-auto mb-4">
      <div class="absolute inset-0 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-full animate-pulse p-1">
        <div class="w-full h-full bg-gray-800 rounded-full flex items-center justify-center">
          <i class="fa-brands fa-instagram text-5xl text-pink-500"></i>
        </div>
      </div>
    </div>

    <!-- Nombre e Identidad -->
    <h1 class="text-2xl font-bold tracking-wide">neo.bnb.mx</h1>
    <p class="text-gray-400 text-sm mt-1">@neo.bnb.mx</p>

    <!-- Enlace Principal a Instagram -->
    <div class="mt-6">
      <a href="https://www.instagram.com/neo.bnb.mx/" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-center gap-3 w-full py-3 px-4 bg-gradient-to-r from-purple-600 via-pink-500 to-red-500 hover:opacity-90 font-semibold rounded-xl shadow-lg transition duration-200">
        <i class="fa-brands fa-instagram text-xl"></i>
        <span>Ver Perfil en Instagram</span>
      </a>
    </div>

    <!-- Grid Simulado de Publicaciones / Galería -->
    <div class="mt-8 border-t border-gray-700 pt-6">
      <h2 class="text-xs uppercase tracking-widest text-gray-400 font-semibold mb-4">Feed Directo</h2>
      
      <div class="grid grid-cols-3 gap-2">
        <a href="https://www.instagram.com/neo.bnb.mx/" target="_blank" class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center hover:bg-gray-600 transition">
          <i class="fa-regular fa-image text-gray-400 text-2xl"></i>
        </a>
        <a href="https://www.instagram.com/neo.bnb.mx/" target="_blank" class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center hover:bg-gray-600 transition">
          <i class="fa-regular fa-image text-gray-400 text-2xl"></i>
        </a>
        <a href="https://www.instagram.com/neo.bnb.mx/" target="_blank" class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center hover:bg-gray-600 transition">
          <i class="fa-regular fa-image text-gray-400 text-2xl"></i>
        </a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-auto py-6 text-xs text-gray-500">
    <p>Conectado con @neo.bnb.mx</p>
  </footer>

</body>
</html>
